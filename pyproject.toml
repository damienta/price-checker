[project]
name = "price-checker"
version = "0.1.0"
description = "Personal UK price tracker: checks product pages, price comparison sites and deal feeds every morning and posts a digest to Discord."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
price-checker = "price_checker.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/price_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
