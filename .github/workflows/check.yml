name: Morning price check

on:
  schedule:
    # GitHub often starts scheduled runs hours late, and is worst on the hour, so this asks
    # several times at odd minutes (UTC) and the gate posts on the first run after 8am UK
    # time each day. For an exact 8am, trigger workflow_dispatch from cron-job.org
    # (docs/SETUP.md, step 4b).
    - cron: "41 6 * * *"
    - cron: "41 7 * * *"
    - cron: "41 8 * * *"
    - cron: "41 10 * * *"
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always start from the newest main, even on "Re-run": a re-run otherwise checks out the
      # commit the run first started on, which is behind the data the first attempt saved.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen --no-dev

      - name: Post once a day, after 8am UK time
        id: gate
        run: |
          # Manual and cron-job.org runs always go ahead.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "run=$(uv run price-checker due)" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check prices
        if: steps.gate.outputs.run == 'true'
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERPAPI_MONTHLY_BUDGET: ${{ vars.SERPAPI_MONTHLY_BUDGET || '240' }}
        run: uv run price-checker check

      - name: Pick up Claude's findings from its branch
        if: steps.gate.outputs.run == 'true'
        run: |
          # The Claude routine pushes to main when allowed, otherwise to claude/findings.
          if git fetch --depth=1 origin claude/findings 2>/dev/null; then
            git show FETCH_HEAD:data/claude_findings.json > "$RUNNER_TEMP/branch_findings.json" || true
          fi

      - name: Post digest to Discord
        if: steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run price-checker digest --post \
            --findings data/claude_findings.json \
            --findings "$RUNNER_TEMP/branch_findings.json"

      - name: Save prices to the repo
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name "price-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ && [ -z "$(git ls-files --others -- data/)" ]; then
            echo "No data changes."
            exit 0
          fi
          # Another run may have saved since this one started. Rather than a git merge (which
          # conflicts on these files), rebuild on top of the newest main: this run's rows are
          # appended to history.csv and its other data files replace main's.
          keep="$RUNNER_TEMP/keep"
          mkdir -p "$keep"
          old_rows=$(git show HEAD:data/history.csv 2>/dev/null | wc -l)
          tail -n +"$((old_rows + 1))" data/history.csv > "$keep/new_rows.csv"
          changed=$( (git diff --name-only -- data/; git ls-files --others -- data/) | grep -v '^data/history.csv$' || true)
          for f in $changed; do mkdir -p "$keep/$(dirname "$f")"; cp "$f" "$keep/$f"; done
          for attempt in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main
            for f in $changed; do mkdir -p "$(dirname "$f")"; cp "$keep/$f" "$f"; done
            cat "$keep/new_rows.csv" >> data/history.csv
            git add data/
            if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
            git commit -qm "data: price check $(TZ=Europe/London date +%Y-%m-%d)"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1

      - name: Tell Discord the run failed
        if: failure() && steps.gate.outputs.run == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          uv run price-checker notify \
            "⚠️ The morning price check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
