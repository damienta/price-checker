name: For you feed

on:
  schedule:
    # Every few hours at odd minutes. GitHub may start these late; the website shows the
    # feed's age so you can tell.
    - cron: "17 6,9,12,15,18,21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev
      - run: uv run price-checker feed
      - name: Save the feed
        run: |
          git config user.name "price-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/feed.json
          git diff --cached --quiet && exit 0
          git commit -m "data: for you feed"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
