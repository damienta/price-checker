name: Track item from issue

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  track:
    # The repo is public, so anyone can open an issue. Only act on the owner's.
    if: >-
      contains(github.event.issue.labels.*.name, 'track') &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --no-dev

      - name: Add the item and check its price
        id: add
        env:
          # Passed as an environment variable, never pasted into the script, so issue text
          # can't run as shell commands.
          ISSUE_BODY: ${{ github.event.issue.body }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: uv run price-checker add-from-issue --reply "$RUNNER_TEMP/reply.md"

      - name: Save to the repo
        run: |
          git config user.name "price-checker[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "track: ${ISSUE_TITLE#Track: } (#${{ github.event.issue.number }})"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}

      - name: Reply and close
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -f "$RUNNER_TEMP/reply.md" ]; then
            gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/reply.md"
          else
            gh issue comment "$NUMBER" --body "Something went wrong adding this. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          if [ "${{ steps.add.outcome }}" = "success" ]; then
            gh issue close "$NUMBER" --reason completed
          fi
